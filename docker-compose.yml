services:
  webapi:
    build:
      context: ./backend
      dockerfile: src/PersonalFinance.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=personalfinance;Username=postgres;Password=postgres
    depends_on:
      seq:
        condition: service_started
      db:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"

  db:
    image: postgres:18-alpine
    container_name: personalfinance-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=personalfinance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalfinance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: postgres-data
